# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ---- Rust ----
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- Python ----
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      pip-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- Docker base images ----
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
