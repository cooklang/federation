services:
  app:
    image: ghcr.io/cooklang/federation:0.4.3
    build: .
    ports:
      # Loopback only: nginx (behind Cloudflare) fronts it. Docker-published
      # ports bypass firewalld, so 0.0.0.0 would expose it directly.
      - "127.0.0.1:${PORT:-3100}:${PORT:-3100}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3100}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
